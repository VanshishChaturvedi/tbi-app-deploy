services:
  - type: web
    name: tbi-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tbi-db
          property: connectionString

databases:
  - name: tbi-db
    databaseName: employee_feedback
    plan: free
